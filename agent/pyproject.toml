[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soar-agent"
version = "0.1.0"
description = "Lightweight SOAR agent for Suricata + nftables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
]

[project.scripts]
soarctl = "soar.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["soar*"]

[tool.setuptools.package-data]
soar = ["assets/**/*"]
